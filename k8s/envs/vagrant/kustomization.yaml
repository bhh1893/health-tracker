# What Argo CD deploys: the app layer only (ADR 0016). The pg Cluster under pg/ and the
# Gateway under k8s/platform/edge/ are owned by scripts and Ansible.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: health-tracker
resources:
  - ../../../services/api/k8s
  - ../../../services/web/k8s
# CI rewrites newTag on each merge (ADR 0016). All zeros until the first image is pushed.
images:
  - name: ghcr.io/bhh1893/health-tracker-api
    newTag: "f9548ab43a3c6c8fe1e2df0da390f95ed7a201c2"
  - name: ghcr.io/bhh1893/health-tracker-web
    newTag: "1b1aec28b191222c448f98cb974e930758be7eb0"
