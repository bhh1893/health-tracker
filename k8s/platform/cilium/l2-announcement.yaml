# The IPs that LoadBalancer Services may take. Both sit on the home LAN, and the
# Gateway takes .250 (ADR 0010).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: home-lan
spec:
  blocks:
    - start: 192.168.0.250
      stop: 192.168.0.251
---
# Who answers ARP for those IPs: one worker at a time, on its bridged NIC. The
# control plane has no NIC on the LAN, so it must never win the election.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: home-lan
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  interfaces:
    - ^eth2$
  loadBalancerIPs: true
