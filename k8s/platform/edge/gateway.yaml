# The one way in (ADR 0010, ADR 0025), reached only by cloudflared. Cilium sees this,
# runs Envoy to serve it, and creates the Service `cilium-gateway-edge`, shaped by
# gateway-class.yaml to have no address outside the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: edge
  annotations:
    # cert-manager's gateway-shim reads this and creates a Certificate for every
    # HTTPS listener's hostname, written to that listener's certificateRefs Secret.
    # Production. To test a change to issuance, switch to letsencrypt-staging first:
    # changing the issuer makes cert-manager issue again from the new one, and
    # production allows 5 certificates per name per 7 days.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium-cluster-only
  listeners:
    # The only listener. No `:80`: browsers never reach the Gateway, and Cloudflare
    # redirects HTTP to HTTPS at its edge (ADR 0025).
    # TLS ends here: Envoy decrypts with the certificate in the Secret below, then
    # routes on the path. cloudflared sends this hostname as SNI (`originServerName`),
    # or the handshake has no certificate to offer.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: health.nibblejiggle.xyz
      tls:
        mode: Terminate
        certificateRefs:
          # The API server fills in `group` and `kind` if left out, and then every
          # apply sees a difference and reports `configured`, which breaks Ansible's
          # changed=0. Same for the route kind below.
          - group: ""
            kind: Secret
            name: health-tls
      # Routes live with their services. Only the app namespace may attach one.
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: health-tracker
