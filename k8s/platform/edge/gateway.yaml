# The one way in (ADR 0010, ADR 0025). Cilium sees this and creates a LoadBalancer
# Service, which takes its IP from the pool in cilium/l2-announcement.yaml, and runs
# Envoy to serve it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: edge
  annotations:
    # cert-manager's gateway-shim reads this and creates a Certificate for every
    # HTTPS listener's hostname, written to that listener's certificateRefs Secret.
    # Production. To test a change to issuance, switch to letsencrypt-staging first:
    # changing the issuer makes cert-manager issue again from the new one, and
    # production allows 5 certificates per name per 7 days.
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  gatewayClassName: cilium
  addresses:
    - type: IPAddress
      value: 192.168.0.250
  listeners:
    # The LAN path the phone uses today. Removed with the LAN path in #147, once the
    # tunnel is verified (ADR 0025).
    - name: http
      protocol: HTTP
      port: 80
      # Routes live with their services. Only the app namespace may attach one.
      allowedRoutes:
        kinds:
          # The API server fills in `group` if left out, and then every apply sees a
          # difference and reports `configured`, which breaks Ansible's changed=0.
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: health-tracker
    # TLS ends here (ADR 0025): Envoy decrypts with the certificate in the Secret
    # below, then routes on the path like the http listener. A client must send this
    # hostname as SNI, or the handshake has no certificate to offer. Routes with no
    # `hostnames` of their own attach to both listeners.
    - name: https
      protocol: HTTPS
      port: 443
      hostname: health.nibblejiggle.xyz
      tls:
        mode: Terminate
        certificateRefs:
          # `group` and `kind` spelled out for the same changed=0 reason as above.
          - group: ""
            kind: Secret
            name: health-tls
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: health-tracker
