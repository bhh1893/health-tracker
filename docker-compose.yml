services:
  db:
    image: postgres:17          # keep the same major version as your CloudNativePG cluster
    environment:
      POSTGRES_USER: health
      POSTGRES_PASSWORD: health
      POSTGRES_DB: health
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health -d health"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Runs once and exits. In Kubernetes this becomes a Job.
  migrate:
    image: ghcr.io/amacneil/dbmate
    command: --wait up
    environment:
      DATABASE_URL: postgres://health:health@db:5432/health?sslmode=disable
      DBMATE_MIGRATIONS_DIR: /db/migrations
      DBMATE_NO_DUMP_SCHEMA: "true"
    volumes:
      - ./db/migrations:/db/migrations:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      HT_DATABASE_URL: postgresql://health:health@db:5432/health
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
