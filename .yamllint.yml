extends: default

rules:
  # GitHub Actions uses `on:` as a key; yamllint would flag it as a truthy value.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  line-length:
    max: 120
  document-start: disable
  # The rest are required by ansible-lint, which refuses a looser config.
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
