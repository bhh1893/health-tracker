extends: default

# Third-party files, not ours to lint.
ignore: |
  node_modules/

rules:
  # GitHub Actions uses `on:` as a key; yamllint would flag it as a truthy value.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false
  line-length:
    max: 120
    # A `key: value` line whose value has no space to break at, such as an image
    # pinned by tag and digest (ADR 0028), may run long.
    allow-non-breakable-inline-mappings: true
  document-start: disable
  # The rest are required by ansible-lint, which refuses a looser config.
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
