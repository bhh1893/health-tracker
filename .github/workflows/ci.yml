name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which path-filtered jobs have work to do.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            yaml:
              - '**/*.yml'
              - '**/*.yaml'

  # Repo-wide, so no path filter: a secret can hide in any file (ADR 0015).
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the tip
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan
        run: ./gitleaks git --redact --verbose .

  yamllint:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install yamllint==1.38.0
      - run: yamllint --strict .

  # The only required check. Always runs; passes when every job it waits on
  # passed or was skipped (ADR 0014).
  ci-gate:
    if: always()
    needs: [changes, gitleaks, yamllint]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needed job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
