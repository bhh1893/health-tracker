name: ci

on:
  pull_request:
  push:
    branches: [main]
    # The bot's tag bump must not start a run that would bump again (ADR 0016).
    paths-ignore:
      - k8s/envs/vagrant/kustomization.yaml

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-pointless run. On main each commit
# gets its own group: a cancelled run there would lose that merge's image for good.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  # Decides which path-filtered jobs have work to do.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      ansible: ${{ steps.filter.outputs.ansible }}
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            ansible:
              - 'iac/ansible/**'
              - '.ansible-lint'
              - '.yamllint.yml'
            api:
              - 'services/api/**'
              - '.github/workflows/ci.yml'
            # The one cross-service trigger: web's types come from api's contract (ADR 0007).
            web:
              - 'services/web/**'
              - 'services/api/openapi.json'
              - '.github/workflows/ci.yml'
            k8s:
              - 'k8s/**'
              - 'services/*/k8s/**'
              - '.github/workflows/ci.yml'

  # Repo-wide, so no path filter: a secret can hide in any file (ADR 0015).
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the tip
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan
        env:
          # PR: only the commits the PR adds. Push to main: the history reachable
          # from main. Without this, gitleaks scans every branch and one bad
          # branch fails every unrelated PR.
          LOG_OPTS: >-
            ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || 'HEAD' }}
        run: ./gitleaks git --redact --verbose --log-opts="${LOG_OPTS}" .

  yamllint:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install yamllint==1.38.0
      - run: yamllint --strict .

  # No real VMs here: GitHub runners cannot run VirtualBox, so this is static
  # analysis only (ADR 0004). Pins match the dev_workstation role defaults.
  ansible-lint:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install ansible-lint==26.10.1
      # --force: ansible-lint already pulled in an ansible-core, and without it
      # pipx keeps that one and ignores this pin.
      - run: pipx inject --force --include-apps ansible-lint ansible-core==2.20.1
      # --force: the runner has its own Ansible, and a collection found there
      # would be skipped, yet ansible-lint's environment cannot see it.
      - run: ansible-galaxy collection install --force -r iac/ansible/requirements.yml
      - run: ansible-lint iac/ansible

  # Renders each Kustomize directory and checks the result against the Kubernetes API
  # schemas, so a mistyped field fails here instead of at deploy. Found by searching,
  # so a new overlay cannot be forgotten. No -ignore-missing-schemas: a kind without a
  # schema fails, rather than passing unchecked.
  kubeconform:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install kubeconform
        env:
          VERSION: 0.8.0
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/v${VERSION}"
          curl -sSfL -O "${base}/kubeconform-linux-amd64.tar.gz"
          curl -sSfL -O "${base}/CHECKSUMS"
          sha256sum --ignore-missing -c CHECKSUMS
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
      - name: Validate every Kustomize directory
        # Stated, not left as the default: only an explicit `bash` gets -o pipefail. Without
        # it a failed render reaches kubeconform as empty input and the step still passes.
        shell: bash
        env:
          # Schemas for custom resources (Gateway, CNPG). Pinned to a commit, because
          # the catalog's main branch can change under us.
          CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/c86448cbf1a840ca62d119259864863897c8748a
        run: |
          find k8s services -name kustomization.yaml -not -path '*/node_modules/*' -printf '%h\n' |
            sort |
            while read -r dir; do
              echo "== ${dir}"
              kubectl kustomize "${dir}" |
                ./kubeconform -strict -summary -kubernetes-version 1.36.0 \
                  -schema-location default \
                  -schema-location "${CATALOG}/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"
            done

  # `--locked` fails if uv.lock no longer matches pyproject.toml. uv pin matches the
  # dev_workstation role defaults; Python comes from services/api/.python-version.
  api-lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Dockerfile uses the same Python as .python-version
        run: |
          expected="FROM python:$(cat .python-version)-"
          if grep '^FROM python:' Dockerfile | grep -vF "${expected}"; then
            echo "these lines do not match ${expected}"
            exit 1
          fi

  # Real Postgres through testcontainers, same command as the dev VM (ADR 0014).
  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run pytest

  # Generated requests against the real API and Postgres: no 5xx, every response matches
  # openapi.json (ADR 0014). Hypothesis sees CI and fixes its seed, so a run only changes when
  # the code or the contract does: this gate cannot fail a PR at random.
  api-fuzz:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run pytest -m fuzz

  # Regenerates the contract; a diff means a model changed without openapi.json (ADR 0003).
  api-openapi-drift:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run python -m health_api.export_openapi
      - run: git diff --exit-code -- openapi.json

  # Build only: pushing to the registry happens on merge (ADR 0016).
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build services/api

  # `npm ci` fails if package-lock.json no longer matches package.json. Node comes
  # from services/web/.node-version.
  web-lint:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: services/web/.node-version
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Dockerfile uses the same Node as .node-version
        run: |
          expected="FROM node:$(cat .node-version)-"
          if grep '^FROM node:' Dockerfile | grep -vF "${expected}"; then
            echo "these lines do not match ${expected}"
            exit 1
          fi

  web-test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: services/web/.node-version
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm test

  # Regenerates the types; a diff means openapi.json changed without schema.d.ts (ADR 0007).
  web-schema-drift:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: services/web/.node-version
          cache: npm
          cache-dependency-path: services/web/package-lock.json
      - run: npm ci
      - run: npm run generate:api
      - run: git diff --exit-code -- src/api/schema.d.ts

  # `docker build` runs `vite build`, so this job covers both. Build only: pushing
  # to the registry happens on merge (ADR 0016). The container then proves the nginx
  # rules from ADR 0007, which no unit test can see.
  web-image:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t web services/web
      - run: docker run -d --read-only --tmpfs /tmp -p 8080:8080 web
      - name: Check the served page and its headers
        run: |
          # --retry-all-errors, not --retry-connrefused: Docker's port proxy accepts the
          # connection before nginx is up, then resets it, which is not a refused connection.
          curl -fsS --retry 10 --retry-all-errors --retry-delay 1 -o /dev/null http://localhost:8080/
          page="$(curl -fsS http://localhost:8080/)"
          grep -q '<div id="root">' <<< "${page}"
          # Deep link: the fallback serves the app, not a 404.
          curl -fsS http://localhost:8080/day/2026-11-05 | grep -q '<div id="root">'
          curl -fsSI http://localhost:8080/ | grep -qi '^cache-control: no-cache'
          asset="$(grep -o '/assets/[^"]*\.js' <<< "${page}" | head -n 1)"
          curl -fsSI "http://localhost:8080${asset}" | grep -qi '^cache-control:.*immutable'
          curl -fsSI http://localhost:8080/manifest.webmanifest | grep -qi '^content-type: application/manifest+json'
          # A missing asset is a real 404, not index.html served as JavaScript.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/assets/missing.js)" = 404

  # The only required check. Always runs; passes when every job it waits on
  # passed or was skipped (ADR 0014).
  ci-gate:
    if: always()
    needs:
      - changes
      - gitleaks
      - yamllint
      - ansible-lint
      - kubeconform
      - api-lint
      - api-test
      - api-fuzz
      - api-openapi-drift
      - api-image
      - web-lint
      - web-test
      - web-schema-drift
      - web-image
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needed job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi

  # Merge only: builds each changed service and pushes it to GHCR, tagged with the commit
  # (ADR 0016). !cancelled(): by default a job is skipped when any job upstream of it was,
  # and path filters skip some of those on nearly every run. ci-gate's result is the test.
  # Third-party actions here are pinned to a commit, because they run with a write token.
  publish:
    needs: [changes, ci-gate]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && needs.ci-gate.result == 'success'
      && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - name: Build and push api
        if: needs.changes.outputs.api == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: services/api
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bhh1893/health-tracker-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build and push web
        if: needs.changes.outputs.web == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: services/web
          platforms: linux/amd64
          push: true
          tags: ghcr.io/bhh1893/health-tracker-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  # Records the new tags in git, which is what Argo CD watches (ADR 0016). A separate job
  # so the key that can write to main never sits beside a Docker build. It pushes past the
  # PR requirement with a deploy key, the ruleset's bypass actor (ADR 0018). Unlike a
  # GITHUB_TOKEN push, that push does fire workflows, so paths-ignore is what stops a loop.
  bump-tags:
    needs: [changes, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the script compares commits to refuse a rollback
          ssh-key: ${{ secrets.TAG_BUMP_DEPLOY_KEY }}
      - name: Commit the new tags to main
        env:
          SERVICES: >-
            ${{ needs.changes.outputs.api == 'true' && 'api' || '' }}
            ${{ needs.changes.outputs.web == 'true' && 'web' || '' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          read -ra services <<< "${SERVICES}"
          .github/scripts/bump-image-tags "${GITHUB_SHA}" "${services[@]}"
