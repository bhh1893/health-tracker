name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: jobs can read the repo and nothing else.
permissions:
  contents: read

# A new push to the same PR cancels the older, now-pointless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which path-filtered jobs have work to do.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      yaml: ${{ steps.filter.outputs.yaml }}
      ansible: ${{ steps.filter.outputs.ansible }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            yaml:
              - '**/*.yml'
              - '**/*.yaml'
            ansible:
              - 'iac/ansible/**'
              - '.ansible-lint'
              - '.yamllint.yml'
            api:
              - 'services/api/**'
              - '.github/workflows/ci.yml'

  # Repo-wide, so no path filter: a secret can hide in any file (ADR 0015).
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the tip
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -O "${base}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan
        env:
          # PR: only the commits the PR adds. Push to main: the history reachable
          # from main. Without this, gitleaks scans every branch and one bad
          # branch fails every unrelated PR.
          LOG_OPTS: >-
            ${{ github.event_name == 'pull_request'
            && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha)
            || 'HEAD' }}
        run: ./gitleaks git --redact --verbose --log-opts="${LOG_OPTS}" .

  yamllint:
    needs: changes
    if: needs.changes.outputs.yaml == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install yamllint==1.38.0
      - run: yamllint --strict .

  # No real VMs here: GitHub runners cannot run VirtualBox, so this is static
  # analysis only (ADR 0004). Pins match the dev_workstation role defaults.
  ansible-lint:
    needs: changes
    if: needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: pipx install ansible-lint==26.10.1
      - run: pipx inject ansible-lint ansible-core==2.20.1
      - run: ansible-lint iac/ansible

  # `--locked` fails if uv.lock no longer matches pyproject.toml. uv pin matches the
  # dev_workstation role defaults; Python comes from services/api/.python-version.
  api-lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - name: Dockerfile uses the same Python as .python-version
        run: |
          expected="FROM python:$(cat .python-version)-"
          if grep '^FROM python:' Dockerfile | grep -vF "${expected}"; then
            echo "these lines do not match ${expected}"
            exit 1
          fi

  # Real Postgres through testcontainers, same command as the dev VM (ADR 0014).
  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run pytest

  # Regenerates the contract; a diff means a model changed without openapi.json (ADR 0003).
  api-openapi-drift:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.7
      - run: uv sync --locked
      - run: uv run python -m health_api.export_openapi
      - run: git diff --exit-code -- openapi.json

  # Build only: pushing to the registry happens on merge (ADR 0016).
  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: docker build services/api

  # The only required check. Always runs; passes when every job it waits on
  # passed or was skipped (ADR 0014).
  ci-gate:
    if: always()
    needs: [changes, gitleaks, yamllint, ansible-lint, api-lint, api-test, api-openapi-drift, api-image]
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any needed job failed or was cancelled
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "needed job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            exit 1
          fi
