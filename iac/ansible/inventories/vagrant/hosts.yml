# These IPs are duplicated in iac/vagrant/cluster/Vagrantfile on purpose (ADR 0004).
# Change one, change the other.
all:
  vars:
    ansible_user: vagrant
    ansible_ssh_private_key_file: ~/.ssh/health-tracker-ops
  children:
    k8s_cluster:
      vars:
        # The address Kubernetes uses. A separate name because in a cloud, Ansible may
        # reach a node through a different address than the cluster does.
        node_ip: "{{ ansible_host }}"
      children:
        control_plane:
          hosts:
            k8s-cp-1:
              ansible_host: 192.168.56.10
        workers:
          hosts:
            k8s-worker-1:
              ansible_host: 192.168.56.11
            k8s-worker-2:
              ansible_host: 192.168.56.12
    # Nodes with a NIC bridged to the home LAN. Vagrant-only: see site.yml.
    bridged:
      hosts:
        k8s-worker-1:
        k8s-worker-2:
