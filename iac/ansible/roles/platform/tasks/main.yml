- name: Load the pinned versions
  ansible.builtin.include_vars:
    file: "{{ platform_dir }}/{{ item }}/versions.yml"
  loop:
    - local-path-provisioner
    - cnpg
    - cert-manager
    - barman-cloud
    - argocd

# The chart has no Helm repo, so fetch the project's own copy at the pinned tag.
- name: Fetch the local-path-provisioner chart
  ansible.builtin.git:
    repo: "{{ local_path_git_repo }}"
    dest: "{{ platform_local_path_checkout }}"
    version: "{{ local_path_git_version }}"
    depth: 1

- name: Install local-path-provisioner
  kubernetes.core.helm:
    name: local-path-provisioner
    chart_ref: "{{ platform_local_path_checkout }}/deploy/chart/local-path-provisioner"
    release_namespace: local-path-storage
    create_namespace: true
    values_files:
      - "{{ platform_dir }}/local-path-provisioner/values.yaml"
    wait: true
    timeout: 5m0s

- name: Install the CNPG operator
  kubernetes.core.helm:
    name: cnpg
    chart_ref: cloudnative-pg
    chart_repo_url: "{{ cnpg_chart_repo }}"
    chart_version: "{{ cnpg_chart_version }}"
    release_namespace: cnpg-system
    create_namespace: true
    values_files:
      - "{{ platform_dir }}/cnpg/values.yaml"
    wait: true
    timeout: 5m0s

# Before the plugin: the plugin's chart creates cert-manager Certificates.
- name: Install cert-manager
  kubernetes.core.helm:
    name: cert-manager
    chart_ref: cert-manager
    chart_repo_url: "{{ cert_manager_chart_repo }}"
    chart_version: "{{ cert_manager_chart_version }}"
    release_namespace: cert-manager
    create_namespace: true
    values_files:
      - "{{ platform_dir }}/cert-manager/values.yaml"
    wait: true
    timeout: 5m0s

# Goes through cert-manager's admission webhook, which can refuse for a few seconds
# after the install reports ready, so retry instead of failing the run.
- name: Apply the Let's Encrypt ClusterIssuers
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --filename
      - "{{ platform_dir }}/cert-manager/cluster-issuers.yaml"
  register: platform_issuers_apply
  until: platform_issuers_apply.rc == 0
  retries: 6
  delay: 10
  changed_when: platform_issuers_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0

# Must share the operator's namespace, which is how CNPG discovers it.
- name: Install the Barman Cloud plugin
  kubernetes.core.helm:
    name: plugin-barman-cloud
    chart_ref: plugin-barman-cloud
    chart_repo_url: "{{ barman_cloud_chart_repo }}"
    chart_version: "{{ barman_cloud_chart_version }}"
    release_namespace: cnpg-system
    values_files:
      - "{{ platform_dir }}/barman-cloud/values.yaml"
    wait: true
    timeout: 5m0s

- name: Install Argo CD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: "{{ argocd_chart_repo }}"
    chart_version: "{{ argocd_chart_version }}"
    release_namespace: argocd
    create_namespace: true
    values_files:
      - "{{ platform_dir }}/argocd/values.yaml"
    wait: true
    timeout: 10m0s

# Before the Gateway: its cert-manager annotation starts an issuance as soon as it
# exists, unless the saved certificate is already in place (ADR 0025). The same
# script restore-data runs, so there is still one way secrets enter the cluster.
- name: Copy the secrets into the cluster
  ansible.builtin.command:
    argv:
      - "{{ playbook_dir }}/../scripts/apply-secrets"
  register: platform_apply_secrets
  changed_when: platform_apply_secrets.stdout_lines | reject('search', ' unchanged$') | list | length > 0

# The Gateway and cloudflared are platform, not app, so Argo CD does not own them
# (ADR 0016, ADR 0029). `kubectl diff` decides "changed" here, not apply's output:
# apply always resends a PodDisruptionBudget's selector, a field replaced whole
# rather than merged, so it reports `configured` on every run even when nothing
# differs. diff compares with the cluster through a server dry run. Exit 0 means no
# difference, 1 means a difference, anything else is an error.
- name: Compare the edge manifests with the cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - diff
      - --kustomize
      - "{{ platform_dir }}/edge"
  register: platform_edge_diff
  changed_when: false
  failed_when: platform_edge_diff.rc > 1

- name: Apply the edge Gateway and cloudflared
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --kustomize
      - "{{ platform_dir }}/edge"
  register: platform_edge_apply
  changed_when: platform_edge_diff.rc == 1

# Until apply-secrets runs, Argo CD cannot read the repo and shows a comparison error.
# That is harmless: auto-sync is off, so it tries to change nothing.
- name: Apply the Argo CD Application
  ansible.builtin.command:
    argv:
      - kubectl
      - apply
      - --kustomize
      - "{{ platform_dir }}/argocd"
  register: platform_argocd_apply
  changed_when: platform_argocd_apply.stdout_lines | reject('search', ' unchanged$') | list | length > 0
