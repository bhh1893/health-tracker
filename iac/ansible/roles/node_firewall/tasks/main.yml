- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present

- name: Write the firewall rules
  ansible.builtin.template:
    src: node-firewall.nft.j2
    dest: /etc/node-firewall.nft
    owner: root
    group: root
    mode: "0644"
    validate: nft --check --file %s
  notify: Reload node firewall

- name: Write the systemd unit
  ansible.builtin.template:
    src: node-firewall.service.j2
    dest: /etc/systemd/system/node-firewall.service
    owner: root
    group: root
    mode: "0644"

- name: Enable and start the firewall
  ansible.builtin.systemd_service:
    name: node-firewall
    enabled: true
    state: started
    daemon_reload: true
