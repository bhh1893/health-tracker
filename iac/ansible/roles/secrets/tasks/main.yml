# Each value is generated only if its file is absent (`creates`), so a re-run reports
# changed=0 and never replaces a live secret. Rotation is deleting the file first:
# see docs/runbooks/secrets.md.
#
# Values are written to a temp file and moved into place, so a run killed halfway
# cannot leave a truncated file that `creates` would then accept forever.
- name: Create the secrets directory
  ansible.builtin.file:
    path: "{{ secrets_dir }}"
    state: directory
    mode: "0700"

# No trailing newline: the sidecar compares the file's bytes with the bearer token.
- name: Generate the API token
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      token=$(openssl rand -hex {{ secrets_random_bytes }})
      printf '%s' "$token" > api-token.tmp
      mv api-token.tmp api-token
    chdir: "{{ secrets_dir }}"
    creates: "{{ secrets_dir }}/api-token"
  no_log: true

# Hex passwords need no URL escaping (ADR 0015). The keys become the Secret's keys.
- name: Generate the database credentials
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      password=$(openssl rand -hex {{ secrets_random_bytes }})
      cat > {{ item.name }}.env.tmp <<EOT
      username={{ item.username }}
      password=$password
      DATABASE_URL=postgresql://{{ item.username }}:$password@{{ secrets_db_endpoint }}
      EOT
      mv {{ item.name }}.env.tmp {{ item.name }}.env
    chdir: "{{ secrets_dir }}"
    creates: "{{ secrets_dir }}/{{ item.name }}.env"
  loop: "{{ secrets_db_roles }}"
  no_log: true

# No passphrase: Argo CD reads this key unattended. It can only read this repo.
- name: Generate the Argo CD deploy key
  ansible.builtin.shell:
    cmd: |
      set -eu
      umask 077
      ssh-keygen -q -t ed25519 -N '' -C 'health-tracker argocd' -f argocd-deploy-key
    chdir: "{{ secrets_dir }}"
    creates: "{{ secrets_dir }}/argocd-deploy-key"
  no_log: true
