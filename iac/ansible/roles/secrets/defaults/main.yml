# Source of truth for every generated secret (ADR 0015). Outside the repo on purpose.
secrets_dir: "{{ ansible_facts['user_dir'] }}/.config/health-tracker"

secrets_random_bytes: 32  # hex output is twice this many characters
secrets_db_name: health

# `pg-rw` is CNPG's read-write Service. The short name resolves because `api` and
# the migration Job share a namespace with `pg` (ADR 0005).
secrets_db_endpoint: "pg-rw:5432/{{ secrets_db_name }}"

# `name` is the Kubernetes Secret, `username` the Postgres role.
secrets_db_roles:
  - name: db-owner
    username: app
  - name: db-api
    username: api_rw
