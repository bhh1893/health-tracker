# Takes the nodes to "all Ready with Cilium healthy" (ADR 0004). Run from iac/ansible:
#   ansible-playbook site.yml
# base goes first: it closes password SSH, and workers are on the LAN.
- name: Secure and prepare the OS
  hosts: k8s_cluster
  become: true
  roles:
    - role: base

# The `bridged` group exists only in the Vagrant inventory, so in a cloud this
# play matches no hosts and does nothing.
- name: Stop the bridged NIC adding routes
  hosts: bridged
  become: true
  roles:
    - role: bridged_nic

- name: Install the container runtime and Kubernetes packages
  hosts: k8s_cluster
  become: true
  roles:
    - role: containerd
    - role: kube_packages

- name: Start the control plane
  hosts: control_plane
  become: true
  roles:
    - role: control_plane

- name: Join the workers
  hosts: workers
  become: true
  roles:
    - role: worker

# Runs on the dev VM itself: helm, kubectl and this repo are all here.
- name: Install Cilium
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: cilium
