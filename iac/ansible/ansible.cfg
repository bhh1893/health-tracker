# Read when Ansible runs from this directory: `cd iac/ansible`.
[defaults]
inventory = inventories/vagrant/hosts.yml

[ssh_connection]
# accept-new: trust a node's key the first time, refuse if it later changes (ADR 0004).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
