# Replaces the image's default server. The image already runs nginx as a non-root
# user and keeps its pid and temp files in /tmp.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Do not advertise the nginx version on error pages.
    server_tokens off;

    # Vite puts a content hash in these filenames, so a changed file gets a new URL
    # and an old URL's content can never change. Safe to cache for a year.
    # No fallback: a missing asset is a real 404, not index.html served as JavaScript.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's mime.types does not know this extension, and browsers expect the manifest type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Real files, or index.html so React Router can handle deep links on refresh.
    # no-cache means "revalidate first", so a deploy shows up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
