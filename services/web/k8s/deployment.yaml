apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  # Two, so draining a worker does not take the page down.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      # One pod per worker, so losing a worker leaves one serving. This acts only when a pod
      # is scheduled: nothing moves pods back after a worker returns, until they restart.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Leave out nodes this pod cannot run on. Otherwise the control plane counts as a
          # worker with zero pods, and a rollout's extra pod could never be placed.
          nodeTaintsPolicy: Honor
          # Count only this rollout's pods, so the old ones it is replacing do not skew it.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: web
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/bhh1893/health-tracker-web
          ports:
            - name: http
              containerPort: 8080
          # Static files with no dependencies, so one check answers both questions.
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # nginx keeps its pid and temp files here. The same setup CI runs the image with.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
