# The auth-proxy sidecar's port, named `http` in k8s/components/auth-proxy/. nginx's own
# port is not reachable from outside the pod.
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: web
spec:
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 80
      targetPort: http
