[project]
name = "health-api"
version = "0.1.0"
description = "Health Tracker API"
requires-python = "==3.14.*"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "schemathesis>=4.33.1",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Each runs on its own (ADR 0014). A later -m wins, so `pytest -m fuzz` still selects them.
addopts = "--strict-markers --strict-config -m 'not fuzz and not index_plans'"
markers = [
    "fuzz: Schemathesis against the real API and Postgres",
    "index_plans: needs the full seed; runs weekly, not on PRs (ADR 0014)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests", "migrations"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
