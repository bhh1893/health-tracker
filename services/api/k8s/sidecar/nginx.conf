# The auth sidecar (ADR 0010). Replaces the image's default server. Two ports, because
# they have different callers: the Gateway must show a token, the kubelet cannot.

# The Gateway's port. Only /api/ is proxied, so a valid token still cannot reach /healthz.
server {
    listen 8080;
    # Do not advertise the nginx version on error pages.
    server_tokens off;

    # Written by start.sh: `set $expected_authorization "Bearer <token>";`
    include /tmp/expected-authorization.conf;

    location /api/ {
        if ($http_authorization != $expected_authorization) {
            return 401;
        }
        # api has no auth code, so it has no reason to see the token, or to log it.
        proxy_set_header Authorization "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }

    # Applies to the 401 above only: without proxy_intercept_errors, errors from api
    # pass through untouched.
    error_page 401 @unauthorized;
    location @unauthorized {
        default_type application/problem+json;
        add_header WWW-Authenticate Bearer always;
        return 401 '{"type":"about:blank","title":"Unauthorized","status":401}';
    }

    location / {
        return 404;
    }
}

# The kubelet's port. Probes arrive on the pod IP, and api listens only on localhost, so
# they need a way in. Serves health status and nothing else, so it needs no token.
server {
    listen 8081;
    server_tokens off;
    # One line per probe per pod would bury the real traffic.
    access_log off;

    location = /healthz {
        proxy_pass http://127.0.0.1:8000;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8000;
    }

    # This container's own liveness: answered by nginx, so a hung api restarts api
    # and a hung nginx restarts nginx.
    location = /sidecar-healthz {
        return 204;
    }

    location / {
        return 404;
    }
}
