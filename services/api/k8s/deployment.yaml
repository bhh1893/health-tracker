apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # Two, so draining a worker does not take the API down.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Neither container calls the Kubernetes API, so neither gets a credential for it.
      automountServiceAccountToken: false
      # One pod per worker, so losing a worker leaves one serving. This acts only when a pod
      # is scheduled: nothing moves pods back after a worker returns, until they restart.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Leave out nodes this pod cannot run on. Otherwise the control plane counts as a
          # worker with zero pods, and a rollout's extra pod could never be placed.
          nodeTaintsPolicy: Honor
          # Count only this rollout's pods, so the old ones it is replacing do not skew it.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # A native sidecar: an init container with restartPolicy Always keeps running, and
      # Kubernetes starts it before `api` and stops it after, so requests in flight
      # during a shutdown still have a path out.
      initContainers:
        - name: auth-sidecar
          image: nginxinc/nginx-unprivileged:1.30.6-alpine3.24
          restartPolicy: Always
          command: ["/bin/sh", "/etc/sidecar/start.sh"]
          ports:
            - name: http
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /sidecar-healthz
              port: health
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: sidecar-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
            - name: sidecar-config
              mountPath: /etc/sidecar/start.sh
              subPath: start.sh
            - name: api-token
              mountPath: /run/secrets/api-token
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: ghcr.io/bhh1893/health-tracker-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-api
                  key: DATABASE_URL
          # All three go through the sidecar's health port, because `api` listens only on
          # localhost and the kubelet calls the pod IP (ADR 0010). A number, not `health`:
          # a port name resolves only within its own container.
          # Startup holds off liveness, so a slow first boot is not killed as a hang.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: sidecar-config
          configMap:
            name: api-sidecar
        - name: api-token
          secret:
            secretName: api-token
        # In memory, because start.sh writes the token here.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
