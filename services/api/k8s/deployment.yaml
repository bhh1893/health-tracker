apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  # Two, so draining a worker does not take the API down.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
    spec:
      # Nothing in the pod calls the Kubernetes API, so it gets no credential for it.
      automountServiceAccountToken: false
      # One pod per worker, so losing a worker leaves one serving. This acts only when a pod
      # is scheduled: nothing moves pods back after a worker returns, until they restart.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          # Leave out nodes this pod cannot run on. Otherwise the control plane counts as a
          # worker with zero pods, and a rollout's extra pod could never be placed.
          nodeTaintsPolicy: Honor
          # Count only this rollout's pods, so the old ones it is replacing do not skew it.
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: api
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/bhh1893/health-tracker-api
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-api
                  key: DATABASE_URL
          # All three go through the auth-proxy sidecar (k8s/components/auth-proxy/),
          # which passes /healthz and /readyz through with no session: `api` listens
          # only on localhost and the kubelet calls the pod IP (ADR 0021). A number, not
          # `http`: a port name resolves only within its own container.
          # Startup holds off liveness, so a slow first boot is not killed as a hang.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
