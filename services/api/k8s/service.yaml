# The auth-proxy sidecar's port, named `http` in k8s/components/auth-proxy/. `api`'s own
# port is not reachable from outside the pod.
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 80
      targetPort: http
