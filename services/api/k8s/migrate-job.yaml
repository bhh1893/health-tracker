# Runs `alembic upgrade head`, then loads the Reference Foods CSV, before each deploy
# (ADR 0016, ADR 0023). If either fails, Argo CD stops the sync and the old `api` keeps
# serving. The fixed name and BeforeHookCreation mean
# one Job at a time: Argo CD deletes the last run just before starting the next.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels:
    app.kubernetes.io/name: api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  # A migration stuck on a lock must fail the deploy, not hold it open forever.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/bhh1893/health-tracker-api
          # A shell only for `&&`: the load must not run against a schema that failed to
          # migrate. `exec` hands the container over to Python, so its exit code is the Job's.
          command:
            - sh
            - -c
            - alembic upgrade head && exec python -m health_api.reference_foods
          env:
            # db-owner, not db-api: only this role may change tables, or write to
            # reference_foods (ADR 0015, ADR 0023).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-owner
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
