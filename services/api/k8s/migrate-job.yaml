# Runs `alembic upgrade head` before each deploy (ADR 0016). If it fails, Argo CD stops
# the sync and the old `api` keeps serving. The fixed name and BeforeHookCreation mean
# one Job at a time: Argo CD deletes the last run just before starting the next.
apiVersion: batch/v1
kind: Job
metadata:
  name: api-migrate
  labels:
    app.kubernetes.io/name: api-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  # A migration stuck on a lock must fail the deploy, not hold it open forever.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/bhh1893/health-tracker-api
          command: ["alembic", "upgrade", "head"]
          env:
            # db-owner, not db-api: only this role may change tables (ADR 0015).
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-owner
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
