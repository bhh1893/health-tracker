# The api base: what is true in every environment. Namespace, image tag and the
# auth-proxy sidecar come from the overlay in k8s/envs/<env>/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - migrate-job.yaml
  - smoke-job.yaml
